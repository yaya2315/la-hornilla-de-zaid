  <style>

    @font-face{font-family:Oswald;font-weight:600;font-display:swap;src:url(fuentes/oswald-600.woff2) format("woff2")}
    @font-face{font-family:Poppins;font-weight:500;font-display:swap;src:url(fuentes/poppins-500.woff2) format("woff2")}

    :root{
      --verde:#2f7424; --verde-hoja:#1f5a17; --verde-oscuro:#18420f;
      --crema:#f6ecd2; --lima:#d6e22b; --amarillo:#ffd21f; --tinta:#141414;
      --rojo:#d9201f;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{
      min-height:100vh;min-height:100dvh;
      font-family:Poppins,system-ui,sans-serif;color:var(--crema);
      background-color:var(--verde);
      background-image:radial-gradient(rgba(255,255,255,.09) 1.6px,transparent 1.8px);
      background-size:16px 16px;
      display:flex;flex-direction:column;align-items:center;
      padding-bottom:max(28px,env(safe-area-inset-bottom));
    }

    /* Banderitas de papel picado */
    .banderas{
      width:100%;height:56px;flex:none;
      background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='56' viewBox='0 0 420 56'><path d='M0 6 Q210 14 420 6' fill='none' stroke='%2318420f' stroke-width='2'/><g stroke='%23141414' stroke-opacity='.25' stroke-width='1.5'><path d='M10 8h34v36l-8.5-7-8.5 7-8.5-7-8.5 7z' fill='%23f6ecd2'/><path d='M80 10h34v36l-8.5-7-8.5 7-8.5-7-8.5 7z' fill='%23ffd21f'/><path d='M150 11h34v36l-8.5-7-8.5 7-8.5-7-8.5 7z' fill='%23ff8a1f'/><path d='M220 11h34v36l-8.5-7-8.5 7-8.5-7-8.5 7z' fill='%23e8208c'/><path d='M290 10h34v36l-8.5-7-8.5 7-8.5-7-8.5 7z' fill='%23d9201f'/><path d='M360 8h34v36l-8.5-7-8.5 7-8.5-7-8.5 7z' fill='%23f6ecd2'/></g><g fill='%23141414' fill-opacity='.35'><circle cx='27' cy='22' r='4.5'/><circle cx='97' cy='24' r='4.5'/><circle cx='167' cy='25' r='4.5'/><circle cx='237' cy='25' r='4.5'/><circle cx='307' cy='24' r='4.5'/><circle cx='377' cy='22' r='4.5'/></g></svg>") repeat-x center top / 420px 56px;
      filter:drop-shadow(0 3px 0 rgba(0,0,0,.18));
    }

    main{width:100%;max-width:460px;padding:6px 18px 0;display:flex;flex-direction:column;align-items:center}

    .logo{display:block;width:min(300px,78vw);height:auto;margin-top:4px}
    .lema{
      font-family:Oswald,sans-serif;font-weight:600;font-size:1.05rem;letter-spacing:.14em;
      text-transform:uppercase;text-align:center;margin-top:-6px;color:var(--crema);
      text-shadow:2px 2px 0 rgba(0,0,0,.35);
    }
    .zona{
      margin-top:10px;font-family:Oswald,sans-serif;font-weight:600;font-size:.82rem;
      letter-spacing:.24em;text-transform:uppercase;color:var(--amarillo);text-align:center;
    }

    .botones{list-style:none;width:100%;margin-top:26px;display:flex;flex-direction:column;gap:14px}
    .boton{
      display:flex;align-items:center;gap:14px;min-height:72px;padding:10px 14px;
      border:3px solid var(--tinta);border-radius:20px;
      background:var(--crema);color:var(--tinta);text-decoration:none;
      box-shadow:0 5px 0 var(--verde-oscuro),0 5px 0 3px var(--tinta);
      transition:transform .12s ease,box-shadow .12s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .boton:active{transform:translateY(4px);box-shadow:0 1px 0 var(--verde-oscuro),0 1px 0 3px var(--tinta)}
    .boton:focus-visible{outline:4px solid var(--amarillo);outline-offset:3px}
    .icono{
      flex:none;width:48px;height:48px;border-radius:14px;border:2.5px solid var(--tinta);
      display:grid;place-items:center;color:#fff;
    }
    .icono svg{width:26px;height:26px;display:block}
    .texto{display:flex;flex-direction:column;min-width:0;flex:1}
    .titulo{font-family:Oswald,sans-serif;font-weight:700;font-size:1.28rem;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
    .detalle{font-size:.78rem;font-weight:500;line-height:1.3;color:#3d3a2e;margin-top:2px}
    .flecha{flex:none;width:22px;height:22px;opacity:.55}

    /* El botón principal (pedir) va más grande y en lima */
    .boton.principal{background:var(--lima);min-height:88px}
    .boton.principal .titulo{font-size:1.3rem;white-space:nowrap}
    .boton.principal .detalle{color:#2d3a08}
    .boton.principal .icono{width:56px;height:56px;border-radius:16px}
    .boton.principal .icono svg{width:32px;height:32px}
    .boton.principal .flecha{opacity:.8}

    .i-wa{background:#1faa54}
    .i-web{background:var(--verde-hoja)}
    .i-ig{background:linear-gradient(45deg,#f9a825 0%,#e8208c 50%,#7b3fe4 100%)}
    .i-tt{background:var(--tinta)}

    .pie{margin-top:30px;text-align:center;font-size:.78rem;line-height:1.6;color:var(--crema)}
    .pie strong{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--crema)}

    @media (prefers-reduced-motion:reduce){.boton{transition:none}}
  </style>
</head>
