<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toma de pedidos — La Hornilla de Zaid</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#120600">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/mesero.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
</head>
<body class="kds-body">

    <header class="kds-header">
        <div class="kds-header-top">
            <span class="kds-title"><span class="ember-dot"></span>Toma de pedidos</span>
            <a href="cocina.html" class="cocina-btn">Ver cocina →</a>
        </div>

        <div id="tipoPedidoWrap" class="tipo-pedido-wrap" role="tablist" aria-label="Tipo de pedido"></div>
        <div id="origenPedidoWrap"></div>

        <p id="comandaBanner" class="comanda-banner" role="status" aria-live="polite">Selecciona una mesa para comenzar</p>
    </header>

    <main class="kds-layout">
        <section aria-label="Menú">
            <div class="menu-toolbar">
                <div class="menu-search-wrap">
                    <input type="text" id="menuBuscar" placeholder="Buscar platillo, pupusa o bebida…" aria-label="Buscar en el menú">
                </div>
                <div id="grupoPills" class="grupo-pills" role="tablist" aria-label="Filtrar por categoría"></div>
            </div>
            <p id="menuEstado" class="menu-estado">Cargando menú desde Firebase…</p>
            <p id="menuVacio" class="menu-vacio hidden">No se encontraron platillos con ese filtro.</p>
            <div id="menuGrid" class="menu-grid"></div>
        </section>

        <aside class="comanda-panel" aria-label="Comanda actual">
            <h2 class="comanda-titulo">Orden</h2>
            <div id="carritoLista" class="carrito-lista"></div>
            <div class="comanda-total">
                <span class="comanda-total-lbl">Total</span>
                <span id="carritoTotal" class="comanda-total-val">$0.00</span>
            </div>
            <button type="button" id="btnEnviarPedido" class="btn-enviar-pedido" disabled>Selecciona una mesa</button>
            <button type="button" id="btnNuevaMesa" class="btn-nueva-mesa">Cambiar de mesa</button>
        </aside>
    </main>

    <div id="kdsToasts" class="kds-toasts" role="status" aria-live="polite"></div>

    <div id="domicilioModalBackdrop" class="domicilio-modal-backdrop"></div>
    <div id="domicilioModal" class="domicilio-modal" role="dialog" aria-modal="true" aria-label="Datos de entrega a domicilio">
        <div class="domicilio-modal-card">
            <button type="button" id="btnCerrarDomicilio" class="btn-cerrar-domicilio" aria-label="Cerrar">✕</button>
            <div class="domicilio-modal-header">
                <span class="domicilio-modal-icon" aria-hidden="true">🛵</span>
                <h2>Datos para el domicilio</h2>
                <p class="domicilio-modal-sub">Pedido enviado a cocina — comparte estos datos con el repartidor</p>
            </div>
            <div id="domicilioModalDatos" class="domicilio-modal-datos"></div>
            <div class="domicilio-modal-acciones">
                <button type="button" id="btnCapturaDomicilio" class="btn-domicilio-accion btn-domicilio-captura">📸 Enviar captura</button>
                <button type="button" id="btnWhatsappDomicilio" class="btn-domicilio-accion btn-domicilio-whatsapp">🟢 Enviar a WhatsApp</button>
            </div>
        </div>
    </div>

    <script type="module" src="../JS/mesero.js"></script>
</body>
</html>
