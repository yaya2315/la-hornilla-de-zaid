<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina — La Hornilla de Zaid</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#120600">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/cocina.css">
</head>
<body class="kds-body">

    <header class="cocina-header">
        <div class="cocina-titulo"><span class="ember-dot"></span>Cocina · La Hornilla de Zaid</div>
        <div class="cocina-acciones">
            <button type="button" id="btnHistorial" class="cocina-btn">Historial de hoy</button>
            <a href="historial.html" class="cocina-btn">Historial completo →</a>
            <button type="button" id="btnFullscreen" class="cocina-btn">Pantalla completa</button>
        </div>
    </header>

    <main class="tablero">
        <section class="columna" data-estado="pendiente" aria-label="Pedidos pendientes">
            <div class="columna-head"><h2>Pendiente</h2><span id="contador-pendiente" class="columna-contador">0</span></div>
            <div id="col-pendiente" class="columna-lista"></div>
        </section>
        <section class="columna" data-estado="preparando" aria-label="Pedidos en preparación">
            <div class="columna-head"><h2>En preparación</h2><span id="contador-preparando" class="columna-contador">0</span></div>
            <div id="col-preparando" class="columna-lista"></div>
        </section>
        <section class="columna" data-estado="listo" aria-label="Pedidos listos">
            <div class="columna-head"><h2>Listo</h2><span id="contador-listo" class="columna-contador">0</span></div>
            <div id="col-listo" class="columna-lista"></div>
        </section>
    </main>

    <div id="historialBackdrop" class="historial-backdrop"></div>
    <aside id="historialDrawer" class="historial-drawer" aria-label="Historial del día">
        <div class="historial-drawer-head">
            <h2>Historial de hoy</h2>
            <button type="button" id="btnCerrarHistorial" class="btn-cerrar-historial" aria-label="Cerrar historial">✕</button>
        </div>
        <div id="historialContenido"></div>
    </aside>

    <script type="module" src="../JS/cocina.js"></script>
</body>
</html>
